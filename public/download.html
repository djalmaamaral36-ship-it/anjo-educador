<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Download Arquivos Corrigidos</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; max-width: 500px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; margin-top: 0; font-size: 22px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .btn { display: block; background: #3b82f6; color: #fff; font-weight: bold; text-decoration: none; padding: 14px 20px; border-radius: 10px; margin: 12px 0; transition: 0.2s; font-size: 15px; }
    .btn:hover { background: #2563eb; }
    .btn-green { background: #10b981; }
    .btn-green:hover { background: #059669; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📥 Baixar Arquivos 100% Corrigidos</h1>
    <p>Clique nos botões abaixo para salvar os arquivos novos no seu computador sem cache:</p>
    
    <a href="/Dashboard.tsx" download="Dashboard.tsx" class="btn">
      1. Baixar Dashboard.tsx
    </a>

    <a href="/FirebaseDiagnosticBar.tsx" download="FirebaseDiagnosticBar.tsx" class="btn">
      2. Baixar FirebaseDiagnosticBar.tsx
    </a>

    <p style="margin-top: 20px; font-size: 12px; color: #64748b;">Depois de baixar, envie para o GitHub na pasta <b>src/components</b>.</p>
  </div>
</body>
</html>
