<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Baixar Dashboard Corrigido</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f8fafc;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
        }
        h1 {
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Seu arquivo está pronto!</h1>
        <p>Clique no botão abaixo para baixar o arquivo <strong>Dashboard.tsx</strong> limpo e corrigido diretamente no seu computador.</p>
        <a href="/Dashboard.txt" download="Dashboard.tsx" class="btn">BAIXAR ARQUIVO</a>
    </div>
</body>
</html>
